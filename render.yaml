# Render blueprint. Deploying from this file rather than clicking through the
# dashboard means the deploy is reviewable in the repo and reproducible if the
# service is ever rebuilt.
#
# One service, not two: the Express server also serves frontend/build, so every
# /api call is same-origin. That removes CORS configuration entirely and keeps
# the Spoonacular key behind the same wall as everything else.
services:
  - type: web
    name: taktouka
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run serve

    # Render restarts the instance if this stops answering. It reports DB and
    # API-key state too, so a failed deploy says which half is wrong.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "20"

      # sync: false means Render prompts for the value and never stores it in
      # this file. Secrets stay out of the repo.
      - key: SPOONACULAR_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false

      # Deliberately unset: ALLOWED_ORIGINS. With one service serving both
      # halves there is no cross-origin request to allow, and an empty list
      # means no browser origin can call this API from elsewhere.
